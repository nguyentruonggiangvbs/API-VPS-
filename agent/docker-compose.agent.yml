services:
  vps-agent:
    image: python:3.12-slim
    container_name: vps-deploy-agent
    restart: always
    working_dir: /agent
    volumes:
      - /opt/api-vps:/agent/project
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DEPLOY_SECRET=CHANGE_ME
      - PROJECT_PATH=/agent/project
    command: python deploy_agent.py
    ports:
      - "9100:9100"
