name: Validate API-VPS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        env:
          API_KEY: 0123456789abcdef0123456789abcdef
          ALLOW_INSECURE_API_KEY: "1"
          DASHBOARD_DIR: ${{ github.workspace }}/dashboard
          DATA_DIR: /tmp/api-vps-data
          MANAGED_ROOTS: repo=${{ github.workspace }}
          PROJECTS_FILE: ${{ github.workspace }}/config/projects.example.json
        run: python -m compileall -q app.py vps_control scripts

      - name: Run security and consistency checks
        run: python scripts/security-check.py

      - name: Validate JavaScript
        run: node --check dashboard/app.js

      - name: Validate shell scripts
        run: |
          bash -n scripts/deploy-vps.sh
          bash -n scripts/update.sh
          sh -n scripts/install.sh
          sh -n scripts/install-nginx.sh
          sh -n scripts/git-askpass.sh

      - name: Validate Docker Compose
        shell: bash
        run: |
          cp .env.example .env
          cp config/projects.example.json config/projects.json
          docker compose config -q
          rm -f .env config/projects.json

      - name: Build container
        run: docker build -t api-vps:test .

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/api-vps-smoke-data /tmp/api-vps-smoke-root
          docker run -d \
            --name api-vps-smoke \
            -p 127.0.0.1:19000:9000 \
            -e API_KEY=0123456789abcdef0123456789abcdef \
            -e ALLOW_INSECURE_API_KEY=1 \
            -e DATA_DIR=/data \
            -e DASHBOARD_DIR=/app/dashboard \
            -e PROJECTS_FILE=/app/config/projects.example.json \
            -e MANAGED_ROOTS=smoke=/tmp/smoke \
            -v /tmp/api-vps-smoke-data:/data \
            -v /tmp/api-vps-smoke-root:/tmp/smoke \
            api-vps:test

          cleanup() {
            docker logs api-vps-smoke || true
            docker rm -f api-vps-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:19000/api/health >/dev/null; then
              curl -fsS \
                -H 'Authorization: Bearer 0123456789abcdef0123456789abcdef' \
                http://127.0.0.1:19000/api/auth/verify
              exit 0
            fi
            sleep 2
          done

          exit 1
