name: Assemble complete VPS Control Center

on:
  push:
    branches:
      - feature/vps-control-panel
    paths:
      - '.github/workflows/assemble-control-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-vps-control-panel
  cancel-in-progress: false

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/control-panel/part-* | base64 --decode > /tmp/api-vps-complete.tar.gz
          echo '6883ad8a2d3b3a26bf4aca9f0e398592699d422fb057d08b1c373ea4630edce9  /tmp/api-vps-complete.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/api-vps-complete.tar.gz > /tmp/archive-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/archive-files.txt; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi

      - name: Replace repository with verified source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          tar -xzf /tmp/api-vps-complete.tar.gz -C .
          chmod 0755 scripts/*.sh
          python3 -m compileall -q app.py vps_control
          node --check dashboard/app.js
          sh -n scripts/install.sh
          sh -n scripts/update.sh
          sh -n scripts/install-nginx.sh
          sh -n scripts/git-askpass.sh

      - name: Commit complete control panel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete API-VPS Control Center'
          git push origin HEAD:feature/vps-control-panel
