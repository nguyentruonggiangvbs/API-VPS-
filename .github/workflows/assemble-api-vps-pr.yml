name: Assemble API-VPS PR payload

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: assemble-api-vps-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  assemble:
    if: github.repository == 'nguyentruonggiangvbs/API-VPS-' && github.head_ref == 'feature/vps-control-panel'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect staged payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.payload/control-panel/part-*' > /dev/null; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify source archive
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/control-panel/part-* | base64 --decode > /tmp/api-vps-complete.tar.gz
          echo '6883ad8a2d3b3a26bf4aca9f0e398592699d422fb057d08b1c373ea4630edce9  /tmp/api-vps-complete.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/api-vps-complete.tar.gz > /tmp/archive-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/archive-files.txt; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi

      - name: Replace repository with verified source
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          tar -xzf /tmp/api-vps-complete.tar.gz -C .

          # GitHub App tokens without the workflows permission cannot push a new
          # workflow file. The CI workflow is added separately by the connector
          # after this verified source commit reaches the PR branch.
          rm -f .github/workflows/ci.yml

          chmod 0755 scripts/*.sh
          python3 -m compileall -q app.py vps_control
          node --check dashboard/app.js
          sh -n scripts/install.sh
          sh -n scripts/update.sh
          sh -n scripts/install-nginx.sh
          sh -n scripts/git-askpass.sh

      - name: Build container
        if: steps.payload.outputs.ready == 'true'
        run: docker build -t api-vps-control-center:ci .

      - name: Commit complete control panel
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete API-VPS Control Center'
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Payload already assembled
        if: steps.payload.outputs.ready != 'true'
        run: echo 'No staged payload remains; nothing to assemble.'
